version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"   # Revisa los sábados
      time: "09:00"
      timezone: "America/Bogota" # Tu hora local
    # Configuración global para ignorar versiones mayores en todos los paquetes
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
