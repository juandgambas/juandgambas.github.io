version: 2
updates:
  # Configuración para Node.js y pnpm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
    
    # Ignorar actualizaciones mayores (major) para recibir solo menores y parches
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    # Mantener el pnpm-lock.yaml actualizado de forma ordenada
    versioning-strategy: increase

    # Límite de PRs abiertas al mismo tiempo
    open-pull-requests-limit: 10
    
    labels:
      - "dependencies"
      - "pnpm"